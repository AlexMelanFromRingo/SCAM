[workspace]
members = [
    "crates/core",
    "crates/node",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.8"
