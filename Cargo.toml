[workspace]
members = [
    "crates/chain",
    "crates/core",
    "crates/consensus",
    "crates/mempool",
    "crates/miner",
    "crates/p2p",
    "crates/rpc",
    "crates/storage",
    "crates/wallet",
    "crates/node",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
argon2 = "0.5"
blake3 = "1.8"
bincode = "1.3"
bech32 = "0.9"
bitcoin = { version = "0.32", default-features = false, features = ["std"] }
bip39 = { version = "2.2", default-features = true, features = ["rand"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
qrcodegen = "1.8"
rand = "0.8"
redb = "2.2"
ripemd = "0.1"
secp256k1 = { version = "0.29", features = ["rand-std", "global-context"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
