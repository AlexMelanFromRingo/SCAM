[workspace]
members = [
    "crates/core",
    "crates/consensus",
    "crates/mempool",
    "crates/miner",
    "crates/p2p",
    "crates/wallet",
    "crates/node",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
bincode = "1.3"
bech32 = "0.9"
bip39 = { version = "2.2", default-features = true, features = ["rand"] }
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
qrcodegen = "1.8"
rand = "0.8"
secp256k1 = { version = "0.29", features = ["rand-std", "global-context"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.8"
