name: Release Build

on:
  push:
    branches:
      - master
    paths:
      - Cargo.toml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect workspace version change
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          if [[ -z "${version}" ]]; then
            echo "Unable to read workspace version from Cargo.toml" >&2
            exit 1
          fi

          changed="false"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            changed="true"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            prev_version="$(git show HEAD^:Cargo.toml | awk -F '"' '/^version = "/ { print $2; exit }' || true)"
            if [[ "${version}" != "${prev_version}" ]]; then
              changed="true"
            fi
          else
            changed="true"
          fi

          prerelease="false"
          if [[ "${version}" == *-* ]]; then
            prerelease="true"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

  build:
    needs: detect-version
    if: needs.detect-version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: linux-x86_64
            exe: ""
          - os: windows-latest
            target_name: windows-x86_64
            exe: ".exe"
          - os: macos-13
            target_name: macos-x86_64
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: scam-release-${{ runner.os }}
          workspaces: |
            . -> target
      - name: Build release binary
        shell: bash
        run: cargo build -p scam-node --release
      - name: Stage binary artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/release/scam-node${{ matrix.exe }}" "dist/scam-node-${{ matrix.target_name }}${{ matrix.exe }}"
      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target_name }}
          path: dist/scam-node-${{ matrix.target_name }}${{ matrix.exe }}
          if-no-files-found: error

  publish:
    needs:
      - detect-version
      - build
    if: needs.detect-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifacts
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -maxdepth 2 -print
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-version.outputs.version }}
          name: SCAM v${{ needs.detect-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.detect-version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/**/scam-node-linux-x86_64
            dist/**/scam-node-windows-x86_64.exe
            dist/**/scam-node-macos-x86_64
